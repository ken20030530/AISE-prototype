<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityU Nav Prototype</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
  #panel { position: absolute; top: 12px; left: 12px; width: 320px; max-height: calc(100vh - 24px); overflow: auto;
    background: rgba(255,255,255,.94); border-radius: 10px; padding: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.15); box-sizing: border-box; }
  h1 { font-size: 16px; margin: 0 0 6px; }
  .warn { font-size: 12px; color: #b45309; background: #fef3c7; padding: 6px 8px; border-radius: 6px; margin: 0 0 10px; }
  label { display: block; font-size: 13px; margin-bottom: 8px; }
  label input, label select { display: block; width: 100%; box-sizing: border-box; margin-top: 3px; padding: 6px 8px;
    font-size: 14px; border: 1px solid #ccc; border-radius: 6px; }
  button { cursor: pointer; border: 1px solid #ccc; background: #fff; border-radius: 6px; padding: 6px 10px; font-size: 13px; }
  #go { width: 100%; background: #c8102e; color: #fff; border: none; padding: 8px; font-size: 14px; }
  #msg { font-size: 13px; margin: 8px 0 4px; color: #444; }
  #msg.error { color: #c00; }
  #steps { font-size: 13px; padding-left: 20px; margin: 4px 0 10px; }
  #steps li { margin-bottom: 4px; }
  #floors { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  #floors button.active { background: #1f2937; color: #fff; border-color: #1f2937; }
  .hint { font-size: 12px; color: #666; margin: 10px 0 0; }
  @media (max-width: 600px) {
    #panel { top: auto; bottom: 0; left: 0; width: 100%; max-height: 45vh; border-radius: 10px 10px 0 0; }
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<body>
<div id="panel">
  <h1>CityU 導航原型</h1>
  <p class="warn">YEUNG / BOC 按 CampusDirectory.pdf（2026-09-07 版）示意圖估計；LAU、LI、JCT、CMC、CIC 用 Location Plan 外形逐層疊起，每層只有一個升降機大堂。大樓之間嘅天橋／扶手電梯按 PDF 標示估位置。全部唔係按比例。</p>
  <label>起點 <input id="from" list="places" placeholder="例如 Concourse 或 LAU 3/F" autocomplete="off"></label>
  <label>目的地 <input id="to" list="places" placeholder="例如 CB、CS、SCM" autocomplete="off"></label>
  <button id="go">搵路</button>
  <div id="msg"></div>
  <ol id="steps"></ol>
  <label>樓層間距 <input type="range" id="gap" min="5" max="25" value="12"></label>
  <label>大樓 <select id="bld"></select></label>
  <div id="floors"></div>
  <p class="hint">可以輸入部門簡稱（例如 CS、CB、SCM）。撳 3D 入面嘅升降機或標籤，會填入你最後撳過嘅輸入框。</p>
</div>
<datalist id="places"></datalist>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// All positions are hand-estimated from CampusDirectory.pdf schematics, not surveyed.
const FLOOR_H = 5;
const LIFT_WAIT = 15;
let floorGap = 12;
const dispY = lvl => lvl * floorGap;
const flName = fl => /^\d/.test(fl) ? `${fl}/F` : fl === 'G' ? 'G/F' : fl;

const toWorld = (ix, iy) => [(ix - 440) * PX + 40, (iy - 440) * PX];

const CONCOURSE_FLOOR = 4;

  { key: 'G', name: '綠區', color: 0x4caf50, x0: -80, x1: -40 },
  { key: 'B', name: '藍區', color: 0x3fa9f5, x0: -40, x1: 0 },

  { key: 'R', name: 'BOC', color: 0xe8452c, x0: 40, x1: 80 },
];

const WING_END = { x: 118, z: -40 };
const TOP_X = [-76, -48, -20, 8, 36];
const YEUNG_LIFTS = [
  { id: 'L16', x: -118, z: -30, floors: YEUNG_FLOORS },
  { id: 'L17', x: -88, z: -40, floors: YEUNG_FLOORS },
  ...TOP_X.map((x, i) => ({ id: `L${i + 1}`, x, z: -10, floors: YEUNG_FLOORS })),
  ...TOP_X.map((x, i) => ({ id: `L${i + 6}`, x, z: 10, floors: YEUNG_FLOORS })),

  { id: 'L19/L20', x: WING_END.x, z: WING_END.z, floors: WING_FLOORS },

const BOC_LIFTS = new Set(['L13', 'L19/L20']);
const SPINE_X = [-100, ...TOP_X, 58, 78];

// ---------- Other buildings (footprints traced from Location Plan pixels) ----------
const nums = (a, b) => Array.from({ length: b - a + 1 }, (_, i) => String(a + i));
const LAU_PODIUM = [[498, 522], [600, 530], [720, 553], [716, 576], [600, 566], [495, 560]];
const LAU_TOWER = [[662, 545], [716, 555], [712, 578], [658, 570]];
const TOWERS = {

    footprint: fl => Number(fl) >= 9 ? LAU_TOWER : LAU_PODIUM },
  LI: { name: 'Li Dak Sum Yip Yio Chin Academic Building', color: 0xc39bd3, floors: ['LG2', 'LG1', 'G', ...nums(1, 6)], core: [598, 470],
    footprint: () => [[565, 525], [610, 522], [632, 470], [646, 395], [622, 380], [602, 396], [588, 460], [566, 495]] },
  JCT: { name: 'Jockey Club One Health Tower', color: 0x7fb3d5, floors: ['B2', 'B1', 'G', '1&2', ...nums(3, 14)], core: [535, 490],
    footprint: () => [[508, 445], [562, 445], [562, 520], [508, 520]] },
  CMC: { name: 'Run Run Shaw Creative Media Centre', color: 0x76d7c4, floors: nums(1, 9), core: [1020, 456],
    footprint: () => [[983, 442], [1035, 420], [1062, 470], [1002, 497]] },

const BUILDING_NAMES = {

  TYB: 'To Yuen Building', ...Object.fromEntries(Object.entries(TOWERS).map(([k, b]) => [k, b.name])),
};
// [code, name, building, floor, lift] from the PDF's Academic Units table
const UNITS = [
  ['CBM', 'College of Biomedicine', 'BOC', 6, 'L13'],
  [null, 'College of Computing', 'YEUNG', 6, 'L6'],
  ['CENG', 'College of Engineering', 'YEUNG', 6, 'L8'],
  ['CSCI', 'College of Science', 'YEUNG', 5, 'L7'],

  ['SYE', 'Department of Systems Engineering', 'YEUNG', 6, 'L1'],
  ['SEE', 'School of Energy and Environment', 'YEUNG', 6, 'L2'],
  ['LC', 'Chan Feng Men-ling Chan Shuk-lin Language Centre', 'LI', 2],
  ['SGS', 'Chow Yei Ching School of Graduate Studies', 'CIC', 2],
  ['CB', 'College of Business', 'LAU', 12],
  ['CLASS', 'College of Liberal Arts and Social Sciences', 'LI', 6],
  ['AC', 'Department of Accountancy', 'LAU', 13],
  ['BMS', 'Department of Biomedical Sciences', 'TYB', 1],
  ['CAH', 'Department of Chinese and History', 'LI', 4],
  ['DS', 'Department of Data Science', 'LAU', 16],
  ['DAO', 'Department of Decision Analytics and Operations', 'LAU', 7],
  ['EF', 'Department of Economics and Finance', 'LAU', 9],
  ['EN', 'Department of English', 'CMC', 8],

  ['IS', 'Department of Information Systems', 'LAU', 6],
  ['LT', 'Department of Linguistics and Translation', 'LI', 5],
  ['MGT', 'Department of Management', 'LAU', 11],
  ['MKT', 'Department of Marketing', 'LAU', 10],

  ['NS', 'Department of Neuroscience', 'TYB', 5],
  ['PIA', 'Department of Public and International Affairs', 'LI', 5],
  ['SS', 'Department of Social and Behavioural Sciences', 'LI', 5],
  ['VCS', 'Department of Veterinary Clinical Sciences', 'JCT', 9],

];

// ---------- Navigation graph ----------
const nodes = new Map();
const adj = new Map();
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
function addNode(n) { n.y = n.lvl * FLOOR_H; nodes.set(n.id, n); adj.set(n.id, []); return n; }
function link(a, b, kind = 'walk', cost) {
  const c = cost ?? dist(nodes.get(a), nodes.get(b));
  adj.get(a).push({ to: b, kind, cost: c });
  adj.get(b).push({ to: a, kind, cost: c });
}
const yNode = (id, x, z, f, label, extra = {}) =>
  addNode({ id, x, z, lvl: f - 1, bld: 'YEUNG', fl: String(f), label, ...extra });

for (const f of YEUNG_FLOORS) {
  SPINE_X.forEach((x, i) => {
    const where = f === CONCOURSE_FLOOR ? 'Herman Hu Concourse' : `YEUNG ${f}/F 走廊`;
    yNode(`${f}-s${i}`, x, 0, f, `${where}（${zoneAt(x).name}）`);
    if (i) link(`${f}-s${i - 1}`, `${f}-s${i}`);
  });
}
const lastSpine = `s${SPINE_X.length - 1}`;
for (const f of WING_FLOORS.filter(f => f <= 7)) {
  yNode(`${f}-w0`, WING_START.x, WING_START.z, f, `BOC ${f}/F 東翼`);
  link(`${f}-w0`, `${f}-${lastSpine}`);
}
const nearestSpine = x => SPINE_X.reduce((best, sx, i) => Math.abs(sx - x) < Math.abs(SPINE_X[best] - x) ? i : best, 0);
for (const lift of YEUNG_LIFTS) {
  const where = BOC_LIFTS.has(lift.id) ? 'BOC' : 'YEUNG';
  lift.floors.forEach((f, k) => {
    const id = `${f}-${lift.id}`;
    yNode(id, lift.x, lift.z, f, `${where} ${f}/F ${lift.id} 升降機大堂`, { lift: lift.id });
    yNode(`${id}-car`, lift.x, lift.z, f, `${lift.id} 升降機`, { lift: lift.id });
    link(id, `${id}-car`, 'liftwait', LIFT_WAIT);
    if (lift.id === 'L19/L20') { if (nodes.has(`${f}-w0`)) link(id, `${f}-w0`); }
    else link(id, `${f}-s${nearestSpine(lift.x)}`);
    if (k) link(`${lift.floors[k - 1]}-${lift.id}-car`, `${id}-car`, 'lift', FLOOR_H);
  });
}
yNode('exit-east', 90, 16, CONCOURSE_FLOOR, 'YEUNG 4/F 東南出口', { door: true });
yNode('exit-west', -132, -30, CONCOURSE_FLOOR, 'YEUNG 4/F 西面出口（往 To Yuen Building）', { door: true });
link('exit-east', `${CONCOURSE_FLOOR}-${lastSpine}`);
link('exit-west', `${CONCOURSE_FLOOR}-L16`);

for (const [key, b] of Object.entries(TOWERS)) {
  const [x, z] = toWorld(...b.core);
  b.floors.forEach((fl, i) => {
    const hall = `${key}|${fl}|hall`;
    addNode({ id: hall, x, z, lvl: i, bld: key, fl, label: `${key} ${flName(fl)} 升降機大堂`, lift: key });
    addNode({ id: `${key}|${fl}|car`, x, z, lvl: i, bld: key, fl, label: `${key} 升降機`, lift: key });
    link(hall, `${key}|${fl}|car`, 'liftwait', LIFT_WAIT);
    if (i) link(`${key}|${b.floors[i - 1]}|car`, `${key}|${fl}|car`, 'lift', FLOOR_H);
  });
}
function door(bld, fl, px, label) {
  const id = `${bld}|${fl}|${px.join(',')}`;
  const [x, z] = toWorld(...px);
  addNode({ id, x, z, lvl: TOWERS[bld].floors.indexOf(fl), bld, fl, label, door: true });
  link(id, `${bld}|${fl}|hall`);
  return id;
}
function outdoor(id, px, lvl, label) {
  const [x, z] = toWorld(...px);
  addNode({ id, x, z, lvl, bld: null, fl: null, label });
  return id;
}

// Inter-building links as marked in the PDF
outdoor('ucircle', [488, 540], 3, 'University Circle（E 集合點）');
link('exit-east', 'ucircle');
link('ucircle', door('LAU', '3', [505, 540], 'LAU 3/F 入口（U-Circle）'));
link('5-w0', door('JCT', '1&2', [512, 455], 'JCT 1-2/F（往 BOC 5/F）'));
link(door('JCT', '1&2', [530, 516], 'JCT 1-2/F 扶手電梯'), door('LAU', '3', [530, 530], 'LAU 3/F（扶手電梯往 JCT）'));
link(door('JCT', '8', [558, 505], 'JCT 8/F 天橋'), door('LAU', '6', [575, 540], 'LAU 6/F 天橋（往 JCT 8/F）'));
link(door('LI', '4', [590, 515], 'LI 4/F（往 LAU）'), door('LAU', '3', [590, 545], 'LAU 3/F（往 LI）'));
link(door('LI', 'G', [575, 518], 'LI G/F（往 LAU）'), door('LAU', 'G', [565, 550], 'LAU G/F（往 LI）'));
outdoor('sr-bridge', [760, 585], 5, '歌和老街天橋（往學生宿舍 / CIC / CMC）');
outdoor('sr-path', [880, 560], 2, '學生宿舍行人路');
outdoor('cmc-path', [975, 480], 0, 'Tat Hong Avenue 入口');
link(door('LAU', '7', [712, 566], 'LAU 7/F（往學生宿舍 / CMC / CIC）'), 'sr-bridge');
link('sr-bridge', door('CIC', '2', [790, 615], 'CIC 2/F 入口'));
link('sr-bridge', 'sr-path');
link('sr-path', 'cmc-path');
link('cmc-path', door('CMC', '1', [995, 470], 'CMC 1/F 入口'));

// ---------- Places ----------
const places = new Map();
const aliases = new Map();
const placeList = [];
function addPlace(display, info, ...keys) {
  places.set(display.toUpperCase(), info);
  for (const k of keys) aliases.set(k.toUpperCase(), info);
  placeList.push(display);
}
addPlace('Herman Hu Concourse (4/F)', { node: `${CONCOURSE_FLOOR}-s3` }, 'Concourse');
const unitsAtNode = new Map();
for (const [code, name, bld, floor, lift] of UNITS) {
  const node = bld === 'YEUNG' || bld === 'BOC' ? `${floor}-${lift}`
    : TOWERS[bld] ? `${bld}|${floor}|hall` : 'exit-west';
  addPlace(code ? `${code} - ${name}` : name, { node, unit: { code, name, bld, floor, lift } }, ...(code ? [code] : []));
  if (node !== 'exit-west') {
    if (!unitsAtNode.has(node)) unitsAtNode.set(node, []);
    unitsAtNode.get(node).push(code ?? 'Computing');
  }
}
for (const lift of YEUNG_LIFTS) for (const f of lift.floors) addPlace(`${lift.id} @ ${f}/F`, { node: `${f}-${lift.id}` });
for (const [key, b] of Object.entries(TOWERS)) for (const fl of b.floors) addPlace(`${key} ${flName(fl)}`, { node: `${key}|${fl}|hall` });
for (const n of nodes.values()) if (n.bld === null) addPlace(n.label, { node: n.id });
const lookup = s => { const k = s.trim().toUpperCase(); return places.get(k) ?? aliases.get(k); };

// ---------- A* ----------
function findPath(startId, goalId) {
  const goal = nodes.get(goalId);
  const g = new Map([[startId, 0]]);
  const fScore = new Map([[startId, dist(nodes.get(startId), goal)]]);
  const came = new Map();
  const open = new Set([startId]);
  while (open.size) {
    let cur = null, best = Infinity;
    for (const id of open) { const v = fScore.get(id); if (v < best) { best = v; cur = id; } }
    if (cur === goalId) {
      const seq = [];
      let id = goalId;
      while (id !== startId) { const c = came.get(id); seq.unshift({ id, via: c.kind }); id = c.from; }
      seq.unshift({ id: startId, via: null });
      return { seq, cost: g.get(goalId) };
    }
    open.delete(cur);
    for (const e of adj.get(cur)) {
      const ng = g.get(cur) + e.cost;
      if (ng < (g.get(e.to) ?? Infinity)) {
        came.set(e.to, { from: cur, kind: e.kind });
        g.set(e.to, ng);
        fScore.set(e.to, ng + dist(nodes.get(e.to), goal));
        open.add(e.to);
      }
    }
  }
  return null;
}

function buildSteps(seq) {
  const steps = [];
  let i = 1;
  while (i < seq.length) {
    const isLift = seq[i].via !== 'walk';
    const a = nodes.get(seq[i - 1].id);
    let j = i;
    while (j < seq.length && (seq[j].via !== 'walk') === isLift) j++;
    const b = nodes.get(seq[j - 1].id);
    if (isLift) {
      if (a.lvl !== b.lvl) steps.push(`乘 ${b.lift} 升降機：${flName(a.fl)} → ${flName(b.fl)}`);
    } else {
      const via = [];
      for (let k = i; k < j - 1; k++) {
        const n = nodes.get(seq[k].id);
        if (n.bld !== nodes.get(seq[k - 1].id).bld) via.push(n.label);
      }
      steps.push(`${via.length ? `經 ${via.join(' → ')}，` : ''}行到 ${b.label}`);
    }
    i = j;
  }
  return steps;
}

// ---------- Scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

function makeLabel(text, size, bg = 'rgba(255,255,255,0.85)') {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  const font = 'bold 48px system-ui, "Microsoft JhengHei", sans-serif';
  ctx.font = font;
  canvas.width = Math.ceil(ctx.measureText(text).width) + 24;
  canvas.height = 68;
  ctx.font = font;
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#222';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 12, canvas.height / 2);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  sprite.scale.set(size * canvas.width / canvas.height, size, 1);
  sprite.renderOrder = 500;
  return sprite;
}

// ---------- Surroundings: heights and hills are guesses ----------
const gauss = (x, y, cx, cy, sx, sy) => Math.exp(-(((x - cx) / sx) ** 2 + ((y - cy) / sy) ** 2) / 2);
function terrainHeight(x, z) {
  const ix = (x - 40) / PX + 440, iy = z / PX + 440;
  const mask = THREE.MathUtils.smoothstep(380 - iy, 0, 80);
  return mask * (45 * gauss(ix, iy, 560, 240, 170, 90) + 35 * gauss(ix, iy, 330, 150, 120, 90));
}

{
  const [x0, z0] = toWorld(0, 0), [x1, z1] = toWorld(1300, 760);
  const geo = new THREE.PlaneGeometry(x1 - x0, z1 - z0, 130, 76);
  geo.rotateX(-Math.PI / 2);
  geo.translate((x0 + x1) / 2, 0, (z0 + z1) / 2);
  const pos = geo.attributes.position;
  const flat = new THREE.Color(0xe9e2cf), hill = new THREE.Color(0x86a872), c = new THREE.Color();
  const colors = [];
  for (let i = 0; i < pos.count; i++) {
    const h = terrainHeight(pos.getX(i), pos.getZ(i));
    pos.setY(i, h - 0.6);
    c.copy(flat).lerp(hill, Math.min(1, h / 12));
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  geo.computeVertexNormals();
  scene.add(new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true })));
}

function addRoad(name, pts, width, color = 0x8f969c) {
  const pts2 = pts.map(p => new THREE.Vector2(...toWorld(...p)));
  const samples = [pts2[0]];
  for (let i = 1; i < pts2.length; i++) {
    const n = Math.max(1, Math.ceil(pts2[i - 1].distanceTo(pts2[i]) / 4));
    for (let k = 1; k <= n; k++) samples.push(pts2[i - 1].clone().lerp(pts2[i], k / n));
  }
  const verts = [], index = [];
  samples.forEach((p, i) => {
    const d = samples[Math.min(i + 1, samples.length - 1)].clone().sub(samples[Math.max(i - 1, 0)]).normalize();
    for (const s of [1, -1]) {
      const x = p.x - d.y * s * width / 2, z = p.y + d.x * s * width / 2;
      verts.push(x, terrainHeight(x, z) - 0.3, z);
    }
    if (i) index.push(2 * i - 2, 2 * i - 1, 2 * i, 2 * i - 1, 2 * i + 1, 2 * i);
  });
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(index);
  scene.add(new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2 })));
  if (name) {
    const mid = samples[Math.floor(samples.length / 2)];
    const label = makeLabel(name, 3.5, 'rgba(255,255,255,0.7)');
    label.position.set(mid.x, terrainHeight(mid.x, mid.y) + 4, mid.y);
    scene.add(label);
  }
}

function footprintGeo(pts, depth) {
  const shape = new THREE.Shape(pts.map(p => { const [x, z] = toWorld(...p); return new THREE.Vector2(x, -z); }));
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false });
  geo.rotateX(-Math.PI / 2);
  return geo;
}

const ctxMat = new THREE.MeshLambertMaterial({ color: 0xd9d4ca });
const edgeMat = new THREE.LineBasicMaterial({ color: 0x8a857c });
function addBlock(name, pts, floors, color) {
  const geo = footprintGeo(pts, floors * 4);
  const world = pts.map(p => toWorld(...p));
  const cx = world.reduce((s, p) => s + p[0], 0) / world.length;
  const cz = world.reduce((s, p) => s + p[1], 0) / world.length;
  const base = terrainHeight(cx, cz) - 0.6;
  const mesh = new THREE.Mesh(geo, color ? new THREE.MeshLambertMaterial({ color }) : ctxMat);
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), edgeMat);
  mesh.position.y = edges.position.y = base;
  scene.add(mesh, edges);
  if (name) {
    const label = makeLabel(name, 4);
    label.position.set(cx, base + floors * 4 + 4, cz);
    scene.add(label);
  }
}
const diamond = (cx, cy, r) => [[cx, cy - r], [cx + r, cy], [cx, cy + r], [cx - r, cy]];
function rect(cx, cy, w, d, deg) {
  const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
  return [[-w, -d], [w, -d], [w, d], [-w, d]].map(([u, v]) => [cx + (u * c - v * s) / 2, cy + (u * s + v * c) / 2]);
}

for (const [name, pts, floors, color] of [
  ['MMW', diamond(260, 515, 20), 6],
  ['FYW', diamond(330, 515, 20), 6],
  ['YKC', diamond(375, 515, 20), 6],
  ['CYC', diamond(420, 515, 20), 6],
  ['AEB', [[195, 522], [238, 522], [242, 582], [202, 588], [188, 560]], 6],
  ['TYB', [[185, 362], [212, 368], [224, 402], [194, 404]], 7],
  ['Festival Walk 又一城', [[190, 612], [372, 610], [372, 716], [190, 716]], 7],
  ['FW Office Tower', [[380, 615], [430, 615], [430, 680], [380, 680]], 12],
  ['InnoCentre', [[120, 615], [178, 620], [174, 660], [124, 656]], 6],
  ['Tak Chee Yuen', [[475, 640], [600, 640], [600, 720], [475, 720]], 4],
  ['Nam Shan Building', [[405, 75], [435, 75], [435, 115], [405, 115]], 12],
  [null, [[515, 385], [570, 385], [570, 410], [515, 410]], 0.05, 0x5dade2],
]) addBlock(name, pts, floors, color);
[[805, 560], [860, 530], [905, 500], [950, 465], [950, 540], [915, 585], [870, 630]]
  .forEach(([x, y], i) => addBlock(i === 3 ? 'Student Residence' : null, rect(x, y, 14, 48, -35), 18));

for (const [name, pts, w, color] of [
  ['Tat Chee Avenue 達之路', [[100, 603], [300, 600], [480, 596], [640, 590], [720, 585]], 14],
  ['Cornwall Street 歌和老街', [[720, 585], [850, 500], [1000, 400], [1150, 330], [1290, 300]], 14],
  ['To Yuen Street 桃源街', [[175, 603], [175, 420], [192, 330]], 9],
  ['Tai Hang Tung Road 大坑東道', [[245, 40], [250, 200], [240, 330]], 10],
  ['Nam Shan Chuen Road 南山邨道', [[240, 330], [330, 300], [470, 250], [480, 150], [450, 40]], 8],
  [null, [[620, 30], [700, 120], [820, 200], [1000, 240], [1290, 250]], 18],
  ['地下通道 → 又一城 / 九龍塘站', [[290, 570], [290, 640]], 3, 0xffffff],
]) addRoad(name, pts, w, color);

{
  const park = makeLabel('石硤尾公園 Shek Kip Mei Park', 4, 'rgba(255,255,255,0.7)');
  const [px, pz] = toWorld(660, 330);
  park.position.set(px, terrainHeight(px, pz) + 6, pz);
  scene.add(park);
}

// ---------- Indoor floors ----------
const floorGroups = new Map();
const pickables = [];
const liftGeo = new THREE.BoxGeometry(3, 2.8, 3);
const doorGeo = new THREE.BoxGeometry(4, 1, 4);

function newFloor(bld, fl, lvl) {
  const group = new THREE.Group();
  const labels = new THREE.Group();
  labels.visible = false;
  group.add(labels);
  const g = { bld, fl, lvl, group, labels, materials: [] };
  g.mat = (color, opacity, Ctor = THREE.MeshLambertMaterial) => {
    const m = new Ctor({ color, transparent: true, opacity });
    m.userData.base = opacity;
    g.materials.push(m);
    return m;
  };
  scene.add(group);
  floorGroups.set(`${bld}|${fl}`, g);
  return g;
}

function addLiftBox(g, x, z, place, text, highlight) {
  const box = new THREE.Mesh(liftGeo, g.mat(0x444444, 0.9));
  box.position.set(x, 1.4, z);
  box.userData.place = place;
  g.group.add(box);
  const lbl = highlight ? makeLabel(text, 2.6, 'rgba(255,240,180,0.95)') : makeLabel(text, 1.8);
  lbl.position.set(x, 4.5, z);
  lbl.userData.place = place;
  g.labels.add(lbl);
  pickables.push(box, lbl);
}

for (let f = 1; f <= 9; f++) {
  const g = newFloor('YEUNG', String(f), f - 1);
  const slab = (w, d, x, z, color, { rotY = 0, h = 0.4, y = -0.2, opacity = 0.85 } = {}) => {
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), g.mat(color, opacity));
    mesh.position.set(x, y, z);
    mesh.rotation.y = rotY;
    g.group.add(mesh);
  };
  if (f <= 7) {
    for (const zn of ZONES) {
      const cx = (zn.x0 + zn.x1) / 2, w = zn.x1 - zn.x0;
      if (zn.key === 'P') slab(w, 90, cx, 0, zn.color);
      else if (zn.key === 'R') slab(w, 36, cx, 0, zn.color);
      else {
        slab(w, 24, cx, 0, zn.color);
        slab(24, 26, cx, -25, zn.color);
        slab(24, 26, cx, 25, zn.color);
      }
    }
    slab(190, f === CONCOURSE_FLOOR ? 10 : 4, -15, 0, 0xffffff, { h: 0.05, y: 0.03, opacity: 0.95 });
  }
  if (WING_FLOORS.includes(f)) {
    const dx = WING_END.x - WING_START.x, dz = WING_END.z - WING_START.z;
    slab(Math.hypot(dx, dz) + 10, 14, (WING_START.x + WING_END.x) / 2, (WING_START.z + WING_END.z) / 2,
      0xe8452c, { rotY: Math.atan2(-dz, dx) });
  }
  if (f === CONCOURSE_FLOOR) {
    const c = makeLabel('Herman Hu Concourse', 3);
    c.position.set(-20, 6, 0);
    g.group.add(c);
  }
  for (const lift of YEUNG_LIFTS.filter(l => l.floors.includes(f))) {
    const units = unitsAtNode.get(`${f}-${lift.id}`);
    addLiftBox(g, lift.x, lift.z, `${lift.id} @ ${f}/F`, units ? `${lift.id} · ${units.join(' / ')}` : lift.id, !!units);
  }
  const fl = makeLabel(f <= 7 ? `YEUNG / BOC ${f}/F` : `BOC ${f}/F`, 3.5);
  fl.position.set(-150, 1, 0);
  g.group.add(fl);
}

const towerLabels = [];
for (const [key, b] of Object.entries(TOWERS)) {
  const [cx, cz] = toWorld(...b.core);
  b.floors.forEach((fl, i) => {
    const g = newFloor(key, fl, i);
    const geo = footprintGeo(b.footprint(fl), 0.4);
    const slab = new THREE.Mesh(geo, g.mat(b.color, 0.85));
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), g.mat(0x555555, 0.6, THREE.LineBasicMaterial));
    slab.position.y = edges.position.y = -0.4;
    g.group.add(slab, edges);
    const place = `${key} ${flName(fl)}`;
    const units = unitsAtNode.get(`${key}|${fl}|hall`);
    addLiftBox(g, cx, cz, place, units ? `${place} · ${units.join(' / ')}` : place, !!units);
  });
  const name = makeLabel(`${key} ${b.name}`, 4);
  scene.add(name);
  towerLabels.push({ sprite: name, x: cx, z: cz, top: b.floors.length - 1 });
}

for (const n of nodes.values()) {
  if (!n.door) continue;
  const g = floorGroups.get(`${n.bld}|${n.fl}`);
  const box = new THREE.Mesh(doorGeo, g.mat(0x16a34a, 0.9));
  box.position.set(n.x, 0.5, n.z);
  g.group.add(box);
  const l = makeLabel(n.label, 2.2);
  l.position.set(n.x, 3.5, n.z);
  g.labels.add(l);
}

const outdoorMarkers = [];
const outdoorGeo = new THREE.CylinderGeometry(2, 2, 0.6, 16);
const outdoorMat = new THREE.MeshLambertMaterial({ color: 0x16a34a });
for (const n of nodes.values()) {
  if (n.bld !== null) continue;
  const m = new THREE.Mesh(outdoorGeo, outdoorMat);
  const l = makeLabel(n.label, 2.4);
  scene.add(m, l);
  outdoorMarkers.push({ n, m, l });
}

const shaftMat = new THREE.MeshLambertMaterial({ color: 0x555555, transparent: true, opacity: 0.35 });
const shafts = [
  ...YEUNG_LIFTS.map(l => ({ x: l.x, z: l.z, lo: l.floors[0] - 1, hi: l.floors.at(-1) - 1 })),
  ...Object.values(TOWERS).map(b => { const [x, z] = toWorld(...b.core); return { x, z, lo: 0, hi: b.floors.length - 1 }; }),
].map(s => {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1, 1.5), shaftMat);
  mesh.position.set(s.x, 0, s.z);
  mesh.userData = s;
  scene.add(mesh);
  return mesh;
});

// ---------- Route rendering ----------
const pathMat = new THREE.MeshBasicMaterial({ color: 0xff3b30, depthTest: false, transparent: true, opacity: 0.9 });
const marker = new THREE.Mesh(new THREE.SphereGeometry(1.2, 16, 16), new THREE.MeshBasicMaterial({ color: 0xffffff, depthTest: false }));
marker.renderOrder = 1001;
marker.visible = false;
scene.add(marker);
const pinGeo = new THREE.ConeGeometry(1.5, 4, 16);
pinGeo.rotateX(Math.PI);
const startPin = new THREE.Mesh(pinGeo, new THREE.MeshBasicMaterial({ color: 0x16a34a, depthTest: false }));
const endPin = new THREE.Mesh(pinGeo, new THREE.MeshBasicMaterial({ color: 0xc8102e, depthTest: false }));
for (const p of [startPin, endPin]) { p.renderOrder = 1000; p.visible = false; scene.add(p); }

let pathMesh = null, curve = null, lastSeq = null;
function drawPath(seq) {
  lastSeq = seq;
  if (pathMesh) { scene.remove(pathMesh); pathMesh.geometry.dispose(); }
  curve = new THREE.CurvePath();
  let prev = null;
  for (const s of seq) {
    const n = nodes.get(s.id);
    const p = new THREE.Vector3(n.x, dispY(n.lvl) + 1.2, n.z);
    if (prev && !p.equals(prev)) curve.add(new THREE.LineCurve3(prev, p));
    prev = p;
  }
  pathMesh = new THREE.Mesh(new THREE.TubeGeometry(curve, Math.max(64, curve.curves.length * 8), 0.5, 8, false), pathMat);
  pathMesh.renderOrder = 999;
  scene.add(pathMesh);
  const a = nodes.get(seq[0].id), b = nodes.get(seq.at(-1).id);
  startPin.position.set(a.x, dispY(a.lvl) + 5, a.z);
  endPin.position.set(b.x, dispY(b.lvl) + 5, b.z);
  startPin.visible = endPin.visible = marker.visible = true;
}

// ---------- UI ----------
const $ = id => document.getElementById(id);
const fromInput = $('from'), toInput = $('to'), msg = $('msg'), stepsEl = $('steps'), bldSelect = $('bld');

for (const name of placeList) {
  const opt = document.createElement('option');
  opt.value = name;
  $('places').appendChild(opt);
}

function showMessage(text, isError = false) {
  msg.textContent = text;
  msg.className = isError ? 'error' : '';
}

function route() {
  const from = lookup(fromInput.value), to = lookup(toInput.value);
  stepsEl.replaceChildren();
  if (!from || !to) return showMessage('搵唔到起點或目的地，請喺清單揀。', true);
  if (from.node === to.node) return showMessage('起點同目的地喺同一個位置。', true);
  const result = findPath(from.node, to.node);
  if (!result) return showMessage('搵唔到路線。', true);

  const steps = buildSteps(result.seq);
  const u = to.unit;
  if (u && u.bld === 'TYB') {
    steps.push(`出去 To Yuen Building 後上 ${u.floor}/F（大樓內部未建模）`);
    showMessage(`${u.name}：To Yuen Building ${u.floor}/F`);
  } else if (u) {
    showMessage(`${u.name}：${BUILDING_NAMES[u.bld]} ${u.floor}/F${u.lift ? `，近 ${u.lift} 升降機` : ''}`);
  } else {
    showMessage('');
  }
  for (const s of steps) {
    const li = document.createElement('li');
    li.textContent = s;
    stepsEl.appendChild(li);
  }
  drawPath(result.seq);
  const dest = nodes.get(to.node);
  setFocus(dest.bld, dest.fl);
}

$('go').addEventListener('click', route);
for (const el of [fromInput, toInput]) el.addEventListener('keydown', e => { if (e.key === 'Enter') route(); });

const BLD_FLOORS = { YEUNG: nums(1, 9), ...Object.fromEntries(Object.entries(TOWERS).map(([k, b]) => [k, b.floors])) };
const BLD_CENTER = { YEUNG: [-20, 0], ...Object.fromEntries(Object.entries(TOWERS).map(([k, b]) => [k, toWorld(...b.core)])) };
for (const [value, text] of [['', '全部'], ['YEUNG', 'YEUNG / BOC'], ...Object.entries(TOWERS).map(([k, b]) => [k, `${k} - ${b.name}`])]) {
  const opt = document.createElement('option');
  opt.value = value;
  opt.textContent = text;
  bldSelect.appendChild(opt);
}
bldSelect.addEventListener('change', () => setFocus(bldSelect.value || null, null));

let focus = { bld: null, fl: null };
function renderFloorButtons() {
  const box = $('floors');
  box.replaceChildren();
  if (!focus.bld) return;
  for (const fl of [null, ...BLD_FLOORS[focus.bld]]) {
    const btn = document.createElement('button');
    btn.textContent = fl === null ? '全部' : flName(fl);
    btn.classList.toggle('active', fl === focus.fl);
    btn.addEventListener('click', () => setFocus(focus.bld, fl));
    box.appendChild(btn);
  }
}

function setFocus(bld, fl) {
  focus = { bld, fl };
  const lvl = bld && fl !== null ? BLD_FLOORS[bld].indexOf(fl) : null;
  for (const g of floorGroups.values()) {
    let visible = true, factor = 1, showLabels = false;
    if (bld && g.bld !== bld) factor = 0.25;
    else if (bld && lvl !== null) {
      visible = g.lvl <= lvl;
      if (g.lvl < lvl) factor = 0.15;
      showLabels = g.lvl === lvl;
    }
    g.group.visible = visible;
    for (const m of g.materials) m.opacity = m.userData.base * factor;
    g.labels.visible = showLabels;
  }
  bldSelect.value = bld ?? '';
  renderFloorButtons();
  const [cx, cz] = bld ? BLD_CENTER[bld] : DEFAULT_TARGET;
  const target = new THREE.Vector3(cx, dispY(lvl ?? 3), cz);
  camera.position.add(target.clone().sub(controls.target));
  controls.target.copy(target);
}

function layout() {
  for (const g of floorGroups.values()) g.group.position.y = dispY(g.lvl);
  for (const s of shafts) {
    const lo = dispY(s.userData.lo), hi = dispY(s.userData.hi) + 3;
    s.scale.y = hi - lo;
    s.position.y = (lo + hi) / 2;
  }
  for (const t of towerLabels) t.sprite.position.set(t.x, dispY(t.top) + 8, t.z);
  for (const { n, m, l } of outdoorMarkers) {
    m.position.set(n.x, dispY(n.lvl), n.z);
    l.position.set(n.x, dispY(n.lvl) + 3.5, n.z);
  }
  if (lastSeq) drawPath(lastSeq);
  setFocus(focus.bld, focus.fl);
}
$('gap').addEventListener('input', e => { floorGap = Number(e.target.value); layout(); });

let pickTarget = toInput;
fromInput.addEventListener('focus', () => { pickTarget = fromInput; });
toInput.addEventListener('focus', () => { pickTarget = toInput; });

const isShown = obj => { for (let o = obj; o; o = o.parent) if (!o.visible) return false; return true; };
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downPos || Math.hypot(e.clientX - downPos[0], e.clientY - downPos[1]) > 5) return;
  pointer.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(pickables.filter(isShown), false)[0];
  if (!hit) return;
  pickTarget.value = hit.object.userData.place;
  if (fromInput.value && toInput.value) route();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  controls.update();
  if (curve && curve.curves.length) {
    const t = (clock.getElapsedTime() * 20 / curve.getLength()) % 1;
    marker.position.copy(curve.getPointAt(t));
  }
  renderer.render(scene, camera);
});

layout();
fromInput.value = 'Herman Hu Concourse (4/F)';
toInput.value = 'CB - College of Business';
route();
</script>
